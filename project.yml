name: Resident
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HarnessKit:
    path: HarnessKit
  HarnessMLX:
    path: HarnessMLX
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.18.3
targets:
  Resident:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HarnessKit
      - package: HarnessMLX
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: Resident
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Resident.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Resident
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Resident connects to model servers you add on your local network."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Resident reads and adds calendar events when you ask the assistant about your schedule."
        INFOPLIST_KEY_NSCameraUsageDescription: "Resident uses the camera when you take a photo to attach to a chat."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Resident listens while you dictate a message."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Resident reads and adds reminders when you ask the assistant to."
        INFOPLIST_FILE: App/Info.plist
