<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}: {{ site.tagline }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:title" content="{{ site.title }}: {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description | strip_newlines }}">
  <meta property="og:image" content="{{ '/assets/img/icon.png' | relative_url }}">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="{{ '/assets/img/icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/mark.png' | relative_url }}" alt="" width="26" height="28">
      <span>Resident</span>
    </a>
    <nav aria-label="Sections">
      <a href="{{ '/#why' | relative_url }}">Why local</a>
      <a href="{{ '/#harness' | relative_url }}">Harness</a>
      <a href="{{ '/#engineering' | relative_url }}">Engineering</a>
      <a href="{{ '/#inference' | relative_url }}">Inference</a>
      <a href="{{ '/#models' | relative_url }}">Models</a>
      <a href="{{ '/#questions' | relative_url }}">Questions</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="foot">
    <p>© {{ site.time | date: "%Y" }} Resident. Made for iPhone and iPad.</p>
    <p>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="https://github.com/jflick58/resident">GitHub</a>
    </p>
  </footer>
</body>
</html>
